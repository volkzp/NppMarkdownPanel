name: CI_build

on: [push, pull_request]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Test formula renderers and localization wiring
      run: |
           node tests/katex-smoke.js
           node tests/localization-smoke.js
           node tests/math-engine-settings-smoke.js
           node tests/loader-wiring-smoke.js

    - name: Build of plugin dll and zip
      working-directory: .
      run: |
           ./build.ps1
           ./makerelease.ps1

    - name: Prepare directly installable workflow artifacts
      shell: pwsh
      run: |
           New-Item -ItemType Directory -Path Artifacts/x86, Artifacts/x64 -Force | Out-Null
           $x86 = Get-ChildItem -LiteralPath Release -Filter '*-x86.zip' -File
           $x64 = Get-ChildItem -LiteralPath Release -Filter '*-x64.zip' -File
           if ($x86.Count -ne 1 -or $x64.Count -ne 1) {
               throw "Expected exactly one x86 and one x64 release archive."
           }
           Expand-Archive -LiteralPath $x86.FullName -DestinationPath Artifacts/x86
           Expand-Archive -LiteralPath $x64.FullName -DestinationPath Artifacts/x64

    - name: Archive artifacts x86
      uses: actions/upload-artifact@v7
      with:
          name: NppMarkdownPanel_win32
          path: Artifacts/x86/*

    - name: Archive artifacts x64
      uses: actions/upload-artifact@v7
      with:
          name: NppMarkdownPanel_x64
          path: Artifacts/x64/*
